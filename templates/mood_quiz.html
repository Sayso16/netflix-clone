<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Quiz - MovieTherapist</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0c0c0c, #1a1a1a);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .quiz-container {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 40px;
        max-width: 600px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .quiz-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .quiz-header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        background: linear-gradient(45deg, #e50914, #ff6b6b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .quiz-header p {
        color: #cccccc;
      }

      .question {
        margin-bottom: 30px;
      }

      .question-text {
        font-size: 1.3rem;
        margin-bottom: 20px;
        text-align: center;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .option {
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid transparent;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .option:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(229, 9, 20, 0.3);
      }

      .option.selected {
        background: rgba(229, 9, 20, 0.2);
        border-color: #e50914;
      }

      .option-icon {
        font-size: 1.5rem;
      }

      .submit-btn {
        width: 100%;
        padding: 15px;
        background: #e50914;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 20px;
      }

      .submit-btn:hover {
        background: #f40612;
      }

      .submit-btn:disabled {
        background: #666;
        cursor: not-allowed;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #888;
        text-decoration: none;
      }

      .back-link:hover {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="quiz-container">
      <div class="quiz-header">
        <h1>🎭 Mood Assessment</h1>
        <p>Help us find the perfect movies for how you're feeling</p>
      </div>

      <div class="question">
        <div class="question-text">How are you feeling right now?</div>
        <div class="options">
          <div class="option" data-emotion="stressed">
            <span class="option-icon">😫</span>
            <span>Stressed and overwhelmed</span>
          </div>
          <div class="option" data-emotion="heartbroken">
            <span class="option-icon">💔</span>
            <span>A bit sad or heartbroken</span>
          </div>
          <div class="option" data-emotion="unmotivated">
            <span class="option-icon">😴</span>
            <span>Unmotivated or stuck in a rut</span>
          </div>
          <div class="option" data-emotion="anxious">
            <span class="option-icon">😰</span>
            <span>Anxious or worried</span>
          </div>
          <div class="option" data-emotion="celebratory">
            <span class="option-icon">🎉</span>
            <span>Happy and celebratory!</span>
          </div>
          <div class="option" data-emotion="neutral">
            <span class="option-icon">😊</span>
            <span>Balanced and open to anything</span>
          </div>
        </div>
      </div>

      <button class="submit-btn" id="submitQuiz" disabled>
        Get My Movie Recommendations
      </button>
      <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
      let selectedEmotion = '';

      document.querySelectorAll('.option').forEach((option) => {
        option.addEventListener('click', function () {
          // Remove selected class from all options
          document.querySelectorAll('.option').forEach((opt) => {
            opt.classList.remove('selected');
          });

          // Add selected class to clicked option
          this.classList.add('selected');
          selectedEmotion = this.getAttribute('data-emotion');

          // Enable submit button
          document.getElementById('submitQuiz').disabled = false;
        });
      });

      document
        .getElementById('submitQuiz')
        .addEventListener('click', function () {
          if (selectedEmotion) {
            // Redirect to home with emotion parameter
            window.location.href = `/?emotion=${selectedEmotion}`;
          }
        });
    </script>
  </body>
</html>
